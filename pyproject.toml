[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-to-apple-py"
version = "0.3.0"
description = "Transfer Spotify playlists to Apple Music"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Beza Amsalu", email = "beza.amsalu@columbia.edu" }]
requires-python = ">=3.10"
dependencies = [
    "spotipy>=2.26,<3",
    "requests>=2.31,<3",
    "PyJWT[crypto]>=2.8,<3",
    "python-dotenv>=1.0,<2",
]
keywords = ["spotify", "apple music", "playlist", "transfer", "isrc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Beza4598/spotify_apple_converter"
Documentation = "https://spotify-apple-converter.readthedocs.io/en/latest/"
Issues = "https://github.com/Beza4598/spotify_apple_converter/issues"
Changelog = "https://github.com/Beza4598/spotify_apple_converter/blob/main/CHANGELOG.md"

[project.scripts]
spotify-to-apple = "spotify_to_apple.cli:main"

[project.optional-dependencies]
develop = [
    "black>=26.10.1",
    "build",
    "flake8>=7",
    "flake8-pyproject",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "twine",
    "types-requests",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "myst-parser>=3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spotify_to_apple = ["py.typed"]

[tool.black]
line-length = 120
target-version = ["py310"]
skip-string-normalization = true

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503", "E701"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["spotipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["spotify_to_apple"]
